<button
  type="button"
  class="toggle"
  [attr.aria-label]="theme.resolved() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  [attr.title]="theme.resolved() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
  (click)="theme.toggle()"
>
  <ng-icon [name]="theme.resolved() === 'dark' ? 'lucideSun' : 'lucideMoon'" size="18" />
</button>
